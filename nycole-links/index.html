<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nycole Cedraz</title>
<meta name="description" content="Redes sociais e produtos favoritos de Nycole Cedraz.">
<meta property="og:title" content="Nycole Cedraz">
<meta property="og:description" content="Rotina real de uma mãe desenrolada. Instagram, TikTok e os produtos que uso no dia a dia.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#EBD3DB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23EBD3DB'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-style='italic' font-size='28' text-anchor='middle' fill='%23B8325A'%3ENC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  /* Layout: coluna única "clean girl" — gradiente rosé→branco, pérolas flutuando (three.js) atrás, entrada suave (GSAP) */
  :root {
    --bg: #F6EEF0;
    --bg-top: #EBD3DB;
    --bg-bottom: #FFFFFF;
    --surface: rgba(255,255,255,.72);
    --ink: #2A1620;
    --muted: #8A6C78;
    --line: #E6D6DC;
    --accent: #B8325A;
    --accent-ink: #FFFFFF;
    --font-display: "Playfair Display", "Didot", Georgia, serif;
    --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A1015; --bg-top: #3A2230; --bg-bottom: #140C10; --surface: rgba(36,23,30,.72); --ink: #F5E6EC; --muted: #B596A3;
      --line: #3A2730; --accent: #F06B92; --accent-ink: #1A1015; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1A1015; --bg-top: #3A2230; --bg-bottom: #140C10; --surface: rgba(36,23,30,.72); --ink: #F5E6EC; --muted: #B596A3;
    --line: #3A2730; --accent: #F06B92; --accent-ink: #1A1015; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-bottom) linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 38%, var(--bg-bottom) 100%) no-repeat;
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  #pearls { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .page {
    position: relative; z-index: 1;
    max-width: 440px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 48px 40px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  /* Perfil */
  .profile { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%;
    padding: 4px;
    background: conic-gradient(from 200deg, var(--accent), var(--line), var(--accent));
  }
  .avatar > * {
    width: 100%; height: 100%; border-radius: 50%;
    border: 3px solid var(--bg);
    object-fit: cover;
    display: grid; place-items: center;
    background: var(--surface);
    font-family: var(--font-display); font-style: italic; font-size: 38px; color: var(--accent);
  }
  .name {
    margin: 4px 0 0;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(36px, 10vw, 46px);
    line-height: 1.05;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .name em { font-style: italic; color: var(--accent); }
  .bio { margin: 0; color: var(--muted); max-width: 30ch; }

  /* Redes */
  .socials { display: grid; gap: 12px; }
  .social {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    border-radius: 999px;
    background: var(--surface);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    transition: transform .2s ease, border-color .2s ease;
  }
  .social:hover { transform: translateY(-2px); border-color: var(--accent); }
  .social:focus-visible, .product:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .social svg { width: 22px; height: 22px; flex: none; fill: currentColor; }
  .social .label { font-weight: 600; }
  .social .handle { margin-left: auto; color: var(--muted); font-size: 13px; }
  .social.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .social.primary .handle { color: inherit; opacity: .8; }

  /* Produtos */
  .shelf-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .shelf-head h2 {
    margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: 28px;
  }
  .shelf-head span { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .products { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .product {
    display: flex; flex-direction: column; gap: 10px;
    padding: 10px 10px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    color: var(--ink); text-decoration: none;
    min-width: 0;
    transition: transform .2s ease, border-color .2s ease;
  }
  a.product:hover { transform: translateY(-2px); border-color: var(--accent); }
  .product .thumb {
    aspect-ratio: 1; max-width: 100%; border-radius: 12px;
    background: var(--bg); overflow: hidden;
    display: grid; place-items: center;
  }
  .product .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .product .thumb svg { width: 34px; height: 34px; stroke: var(--muted); fill: none; stroke-width: 1.4; }
  .product .cat { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-inline: 4px; }
  .product .title { font-weight: 600; font-size: 14px; line-height: 1.3; padding-inline: 4px; overflow-wrap: anywhere; }
  .product .cta { margin-top: auto; font-size: 12px; font-weight: 700; color: var(--accent); padding-inline: 4px; }
  .product.soon { border-style: dashed; }
  .product.soon .title { color: var(--muted); font-weight: 500; }

  footer { text-align: center; font-size: 12px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .social, .product { transition: none; } }
</style>
</head>
<body>
<canvas id="pearls" aria-hidden="true"></canvas>
<main class="page">

  <header class="profile">
    <div class="avatar">
      <img src="foto-nycole.jpg" alt="Nycole Cedraz" width="104" height="104">
    </div>
    <h1 class="name">Nycole <em>Cedraz</em></h1>
    <p class="bio">Rotina real de uma mãe desenrolada e já meio atrapalhada das ideias 💡</p>
  </header>

  <nav class="socials" aria-label="Redes sociais">
    <a class="social primary" href="https://instagram.com/nycolecedraz" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1.1.4 2.2.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1.1.4-2.2.4-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1.1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1.1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2m0 1.8c-3.1 0-3.5 0-4.7.1-1.1.1-1.7.2-2.1.4-.5.2-.9.4-1.2.8-.4.4-.6.7-.8 1.2-.2.4-.3 1-.4 2.1C2.7 9.8 2.7 10.2 2.7 12s0 3.5.1 4.7c.1 1.1.2 1.7.4 2.1.2.5.4.9.8 1.2.4.4.7.6 1.2.8.4.2 1 .3 2.1.4 1.2.1 1.6.1 4.7.1s3.5 0 4.7-.1c1.1-.1 1.7-.2 2.1-.4.5-.2.9-.4 1.2-.8.4-.4.6-.7.8-1.2.2-.4.3-1 .4-2.1.1-1.2.1-1.6.1-4.7s0-3.5-.1-4.7c-.1-1.1-.2-1.7-.4-2.1-.2-.5-.4-.9-.8-1.2-.4-.4-.7-.6-1.2-.8-.4-.2-1-.3-2.1-.4C15.5 4 15.1 4 12 4zm0 3.1a4.9 4.9 0 1 1 0 9.8 4.9 4.9 0 0 1 0-9.8zm0 8.1a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zm6.2-8.3a1.1 1.1 0 1 1-2.3 0 1.1 1.1 0 0 1 2.3 0z"/></svg>
      <span class="label">Instagram</span>
      <span class="handle">@nycolecedraz</span>
    </a>
    <a class="social" href="https://www.tiktok.com/@cedraznycole" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 2h-3.3v13.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .8.1V9.2a6.3 6.3 0 1 0 5.4 6.2V8.6a7.6 7.6 0 0 0 4.4 1.4V6.7A4.4 4.4 0 0 1 16.6 2z"/></svg>
      <span class="label">TikTok</span>
      <span class="handle">@cedraznycole</span>
    </a>
  </nav>

  <section aria-labelledby="shelf-title">
    <div class="shelf-head">
      <h2 id="shelf-title">Uso no dia a dia</h2>
      <span id="shelf-count"></span>
    </div>
    <div class="products" id="products"></div>
  </section>

  <footer>© Nycole Cedraz</footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ====== PRODUTOS ======
  // Para adicionar um produto, copie um bloco { ... } e preencha.
  // "imagem" é opcional (URL ou nome do arquivo na mesma pasta).
  const PRODUTOS = [
    // { nome: "Sérum Vitamina C", categoria: "Skincare", link: "https://...", imagem: "serum.jpg" },
  ];

  const icon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>';
  const list = document.getElementById('products');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  if (PRODUTOS.length) {
    list.innerHTML = PRODUTOS.map(p => `
      <a class="product" href="${esc(p.link)}" target="_blank" rel="noopener">
        <div class="thumb">${p.imagem ? `<img src="${esc(p.imagem)}" alt="" loading="lazy">` : icon}</div>
        ${p.categoria ? `<span class="cat">${esc(p.categoria)}</span>` : ''}
        <span class="title">${esc(p.nome)}</span>
        <span class="cta">Ver produto →</span>
      </a>`).join('');
    document.getElementById('shelf-count').textContent = PRODUTOS.length + (PRODUTOS.length === 1 ? ' item' : ' itens');
  } else {
    list.innerHTML = Array.from({length: 4}, () => `
      <div class="product soon">
        <div class="thumb">${icon}</div>
        <span class="cat">Em breve</span>
        <span class="title">Produto favorito</span>
      </div>`).join('');
    document.getElementById('shelf-count').textContent = 'Em breve';
  }
  // ====== MOVIMENTO (leve: só roda se as bibliotecas carregarem e sem "reduzir movimento") ======
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (window.gsap && !calm) {
    gsap.from('.avatar', { scale: .85, opacity: 0, duration: 1.1, ease: 'power3.out' });
    gsap.from('.name, .bio', { y: 16, opacity: 0, duration: 1, stagger: .12, delay: .15, ease: 'power3.out' });
    gsap.from('.social', { y: 18, opacity: 0, duration: .9, stagger: .1, delay: .35, ease: 'power3.out' });
    gsap.from('.shelf-head, .product', { y: 22, opacity: 0, duration: .9, stagger: .07, delay: .55, ease: 'power3.out' });
    gsap.to('.avatar', { rotate: 360, duration: 40, repeat: -1, ease: 'none' });
    gsap.set('.avatar > *', { rotate: 0 });
    gsap.to('.avatar > *', { rotate: -360, duration: 40, repeat: -1, ease: 'none' });
  }

  if (window.THREE) {
    const canvas = document.getElementById('pearls');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, 1, 1, 100);
    camera.position.z = 30;

    // Textura de pérola: brilho radial suave desenhado num canvas pequeno
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), grd = g.createRadialGradient(26, 26, 2, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(.45, 'rgba(255,236,242,.7)');
    grd.addColorStop(1, 'rgba(255,236,242,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 64, 64);

    const N = 70, pos = new Float32Array(N * 3), speed = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      pos[i*3] = (Math.random() - .5) * 50;
      pos[i*3+1] = (Math.random() - .5) * 50;
      pos[i*3+2] = (Math.random() - .5) * 20;
      speed[i] = .008 + Math.random() * .02;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      size: 1.6, map: new THREE.CanvasTexture(c), transparent: true,
      depthWrite: false, opacity: .85, color: 0xF3C9D6
    });
    const pts = new THREE.Points(geo, mat);
    scene.add(pts);

    const resize = () => {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    };
    addEventListener('resize', resize); resize();

    let mx = 0, my = 0;
    addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });

    const tick = t => {
      if (!calm) {
        for (let i = 0; i < N; i++) {
          pos[i*3+1] += speed[i];
          pos[i*3] += Math.sin(t * .0004 + i) * .004;
          if (pos[i*3+1] > 25) pos[i*3+1] = -25;
        }
        geo.attributes.position.needsUpdate = true;
        pts.rotation.y += (mx * .25 - pts.rotation.y) * .03;
        pts.rotation.x += (my * .15 - pts.rotation.x) * .03;
      }
      renderer.render(scene, camera);
      if (!calm) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
</script>
</body>
</html>
